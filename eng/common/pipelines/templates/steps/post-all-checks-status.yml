parameters:
- name: RepoOwner
  type: string
  default: Azure
- name: RepoName
  type: string
  default: azure-sdk-tools
- name: ScriptDirectory
  type: string
  default: eng/common/scripts

steps:
- task: AzureCLI@2
  displayName: "Login to GitHub (All Checks Pass)"
  condition: always()
  inputs:
    azureSubscription: 'AzureSDKEngKeyVault Secrets'
    scriptType: pscore
    scriptLocation: scriptPath
    scriptPath: ${{ parameters.ScriptDirectory }}/login-to-github.ps1
    arguments: >
      -InstallationTokenOwners '${{ parameters.RepoOwner }}'
      -VariableNamePrefix 'GH_TOKEN'

- pwsh: |
    ${{ parameters.ScriptDirectory }}/post-all-checks-status.ps1 `
      -CommitSha "$(Build.SourceVersion)" `
      -RepoOwner "${{ parameters.RepoOwner }}" `
      -RepoName "${{ parameters.RepoName }}"
  displayName: "Post 'All Checks Pass' Status"
  condition: always()
  env:
    GH_TOKEN: $(GH_TOKEN)
