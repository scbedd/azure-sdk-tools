# This pipeline lives in the azure-sdk/internal AzDO project.
# It triggers on completion of every PR-triggered public pipeline in this repo,
# reads the GitHub Checks API for the triggering commit, and exits 0 (all green)
# or 1 (any check still running or failed). AzDO posts the result to GitHub
# automatically — no GitHub API write is needed.
#
# "Handle Status Checks" must be set as the sole required status check in the
# GitHub branch protection rules for `main`.
#
# NOTE: Each `source:` value must match the AzDO pipeline display name exactly
# as registered in the azure-sdk/public project. Confirm names before deploying.

